name: Pull request
run-name: ${{ github.actor }} 🚀 validating pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 90
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint code
        run: make vet
      - name: Run unit tests with coverage
        run: make coverage-terminal
      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ { print substr($3, 1, length($3)-1) }')
          echo "Total coverage: ${TOTAL}% (threshold: ${COVERAGE_THRESHOLD}%)"
          if (( $(awk -v cov="$TOTAL" -v min="$COVERAGE_THRESHOLD" 'BEGIN { print (cov < min) }') )); then
            echo "::error::Code coverage ${TOTAL}% is below the minimum required ${COVERAGE_THRESHOLD}%"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
